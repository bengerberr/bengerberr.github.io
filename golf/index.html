<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Golf</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112d21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Golf">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #112d21; overflow: hidden; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Home screen wrapper: gives the Apps Script game a proper icon and name when added to a phone's home screen. -->
  <iframe id="game" title="Golf" allow="clipboard-write; web-share"></iframe>
  <script>
    // After the first deploy, paste the web app link from golf/deployment.json here.
    var APP = 'https://script.google.com/macros/s/AKfycby5HHa9ALYBJ5lD2WdUYjwKsKFayl3l9W2iMGRSeOLl0h5LPQ95rRDeSWw2-tEQRwZ6/exec';
    document.getElementById('game').src = APP + location.search;
  </script>
</body>
</html>
