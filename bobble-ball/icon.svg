<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2fa25c"/><stop offset=".55" stop-color="#18773f"/><stop offset="1" stop-color="#0b4726"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ced2"/><stop offset="1" stop-color="#9ea5ab"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89c"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#d9982a"/>
    </linearGradient>
    <radialGradient id="ballg" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f1f3f4"/><stop offset="1" stop-color="#cfd5d9"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dx="4" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wallclip"><rect x="92" y="196" width="272" height="196" rx="20"/></clipPath>
    <clipPath id="ballclip"><circle r="88"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>
  <rect x="38" y="38" width="436" height="436" rx="74" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="4" stroke-dasharray="14 11"/>

  <!-- The Wall -->
  <g transform="rotate(-8 228 294)" filter="url(#sh)">
    <rect x="92" y="196" width="272" height="196" rx="20" fill="url(#wall)"/>
    <g clip-path="url(#wallclip)">
      <g stroke="#848c92" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M80 261H380M80 327H380"/>
        <path d="M182 196V261M290 196V261M128 261V327M236 261V327M344 261V327M182 327V392M290 327V392"/>
      </g>
      <g stroke="#ffffff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round">
        <path d="M104 206H170M194 206H278M302 206H352M140 271H224M248 271H332M104 337H170M194 337H278M302 337H352"/>
      </g>
    </g>
    <rect x="92" y="196" width="272" height="196" rx="20" fill="none" stroke="#2f363c" stroke-width="8"/>
  </g>

  <!-- The Iron Cross -->
  <g transform="translate(218 118) rotate(-8)" filter="url(#sh)">
    <g stroke="#5a3a12" stroke-width="16" stroke-linejoin="round">
      <rect x="-21" y="-74" width="42" height="150" rx="21" fill="none"/>
      <rect x="-72" y="-38" width="144" height="42" rx="21" fill="none"/>
    </g>
    <rect x="-21" y="-74" width="42" height="150" rx="21" fill="url(#gold)"/>
    <rect x="-72" y="-38" width="144" height="42" rx="21" fill="url(#gold)"/>
    <g stroke="#fff6cf" stroke-width="7" stroke-linecap="round" opacity=".85">
      <path d="M-9 -60V-46M-58 -26H-38M38 -26H58"/>
    </g>
    <g fill="#d5303e" stroke="#5a3a12" stroke-width="6">
      <circle cx="0" cy="-17" r="13"/>
    </g>
  </g>

  <!-- The ball -->
  <ellipse cx="338" cy="438" rx="78" ry="14" fill="#06301a" opacity=".45"/>
  <g transform="translate(330 350) rotate(14)">
    <circle r="88" fill="url(#ballg)"/>
    <g clip-path="url(#ballclip)" fill="#2a3036">
      <path d="M0 -27L25.7 -8.3L15.9 21.8L-15.9 21.8L-25.7 -8.3Z"/>
      <path id="pp" d="M0 -108L28 -88L18 -60L-18 -60L-28 -88Z"/>
      <use xlink:href="#pp" transform="rotate(72)"/><use xlink:href="#pp" transform="rotate(144)"/>
      <use xlink:href="#pp" transform="rotate(216)"/><use xlink:href="#pp" transform="rotate(288)"/>
    </g>
    <g clip-path="url(#ballclip)" stroke="#2a3036" stroke-width="5" stroke-linecap="round">
      <path id="ss" d="M0 -27V-60"/>
      <use xlink:href="#ss" transform="rotate(72)"/><use xlink:href="#ss" transform="rotate(144)"/>
      <use xlink:href="#ss" transform="rotate(216)"/><use xlink:href="#ss" transform="rotate(288)"/>
    </g>
    <circle r="88" fill="none" stroke="#24292d" stroke-width="8"/>
    <ellipse cx="-34" cy="-46" rx="22" ry="12" transform="rotate(-35 -34 -46)" fill="#fff" opacity=".55"/>
  </g>
</svg>
