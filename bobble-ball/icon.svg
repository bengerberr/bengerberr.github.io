<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="br" width="128" height="64" patternUnits="userSpaceOnUse">
      <rect width="128" height="64" fill="#a3402a"/>
      <rect x="3" y="3" width="122" height="26" rx="3" fill="#b24b31"/>
      <rect x="-61" y="35" width="122" height="26" rx="3" fill="#9a3a25"/>
      <rect x="67" y="35" width="122" height="26" rx="3" fill="#ab452d"/>
    </pattern>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#efe3d4"/><stop offset="1" stop-color="#a8937c"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a140c"/><stop offset="1" stop-color="#5a2615"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- the fence and The Iron Cross above The Wall -->
  <g stroke="#3b2a22" stroke-width="10" stroke-linecap="round">
    <path d="M0 150H512M60 40V230M452 40V230"/>
  </g>
  <g stroke="#ffcf5a" stroke-width="16" stroke-linecap="round">
    <path d="M256 52V214M196 108H316"/>
  </g>
  <!-- The Wall -->
  <rect y="230" width="512" height="282" fill="url(#br)"/>
  <rect y="230" width="512" height="12" fill="#5a2213" opacity=".55"/>
  <!-- the ball, flying for the cross -->
  <g transform="translate(330 300)">
    <path d="M-150 120 Q-60 40 -20 10" stroke="#ffcf5a" stroke-width="10" fill="none" stroke-linecap="round" opacity=".55" stroke-dasharray="2 22"/>
    <circle r="78" fill="url(#ball)"/>
    <path d="M-26 -30l30 -18 28 16 -4 34 -32 12 -26 -18z" fill="#2d211b"/>
    <path d="M-74 -2l20 -6 12 30 -16 26M58 -46l-14 22M44 54l-16 -20M-20 72l4 -24" stroke="#2d211b" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
