<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Amber Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="Amber Games: Mastermind (with a solver bot) and Words.">
  <meta name="theme-color" content="#121213">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Amber Games">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #121213; overflow: hidden; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Home screen wrapper: gives the Apps Script app a proper icon and name when added to a phone's home screen. -->
  <iframe id="game" title="Amber Games" allow="clipboard-write"></iframe>
  <script>
    // The web app link from amber-games/deployment.json.
    var APP = 'https://script.google.com/macros/s/AKfycbyE2QjdvofdCi8pYdD7y7s3cwMAyiPS6vWoEL-fhP2LcSuv8wvSZPMbRQW7kHXNGBuhwA/exec';
    document.getElementById('game').src = APP + location.search;
  </script>
</body>
</html>
