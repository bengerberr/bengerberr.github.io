<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Gerber Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gerber Pay">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1f3a2e; overflow: hidden; }
    /* The notch and the home indicator are kept clear here, so the app inside
       never has to think about them. */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
           box-sizing: border-box; font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #f4efe0; }
    iframe { display: none; width: 100%; height: 100%; border: 0; }
    #setup { display: none; max-width: 30em; margin: 0 auto; padding: 32px 24px; }
    #setup img { width: 72px; height: 72px; border-radius: 16px; display: block; margin-bottom: 16px; }
    #setup h1 { font-size: 22px; margin: 0 0 8px; }
    #setup p { color: #d9d2bf; margin: 0 0 14px; }
    #setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #a9862f; background: #fffefb; color: #1c2822; }
    #setup button { margin-top: 12px; width: 100%; font-size: 16px; font-weight: 600; padding: 13px; border: 0; border-radius: 24px; background: #a9862f; color: #1f3a2e; }
    #err { color: #f4b4a8; display: none; }
  </style>
</head>
<body>
  <!-- Home screen wrapper. An iPhone takes its icon from the page you are on
       when you tap Add to Home Screen, and an Apps Script page belongs to
       Google, so it gives you a plain grey letter. This page shows the app
       full screen under Gerber Pay's own name and icon.

       This page is public, and the app holds private pay data, so the web
       app link is deliberately NOT written anywhere in it. Open this page
       once as  https://bengerberr.github.io/gerber-pay/#<web app link>
       (the part after # never leaves the phone), or paste the link into the
       box it shows. It's remembered on that device from then on. -->
  <iframe id="app" title="Gerber Pay" allow="clipboard-write; fullscreen"></iframe>
  <div id="setup">
    <img src="icon-180.png" alt="">
    <h1>Gerber Pay</h1>
    <p>Paste the Gerber Pay web app link (it starts with https://script.google.com/macros/s/). You only need to do this once on this device.</p>
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    <p id="err">That doesn't look like a Gerber Pay web app link.</p>
    <button id="go">Open Gerber Pay</button>
  </div>
  <script>
    var KEY = 'gerber-pay:app-url';
    var OK = /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/;

    function clean(u) { return String(u || '').trim().replace(/[?#].*$/, '').replace(/\/(dev|exec)?\/?$/, '/exec'); }
    function remember(u) { try { localStorage.setItem(KEY, u); } catch (e) {} }
    function recall() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

    function open(u) {
      var f = document.getElementById('app');
      f.src = u;
      f.style.display = 'block';
      document.getElementById('setup').style.display = 'none';
    }

    var fromHash = location.hash.length > 1 ? clean(decodeURIComponent(location.hash.slice(1))) : '';
    var url = OK.test(fromHash) ? fromHash : clean(recall());
    if (OK.test(url)) {
      remember(url);
      open(url);
    } else {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('go').onclick = function () {
        var u = clean(document.getElementById('url').value);
        if (!OK.test(u)) { document.getElementById('err').style.display = 'block'; return; }
        remember(u);
        open(u);
      };
    }
  </script>
</body>
</html>
