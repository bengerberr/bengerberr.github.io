<!-- Gerber Pay app icon: a gold dollar sign on the app's ledger green.
     The source for icon-180/192/512.png:
       for s in 180 192 512; do rsvg-convert -w $s -h $s icon.svg -o icon-$s.png; done -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5240"/>
      <stop offset="1" stop-color="#1a3327"/>
    </linearGradient>
  </defs>

  <!-- Full bleed: iOS rounds the corners itself. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <g font-family="Caladea, 'Bitstream Charter', 'DejaVu Serif', Georgia, serif"
     font-weight="700" font-size="360" text-anchor="middle">
    <!-- Soft drop shadow, then the gold sign -->
    <text x="264" y="389" fill="#0e1d16" fill-opacity="0.75">$</text>
    <text x="256" y="381" fill="#d9bd7a">$</text>
  </g>
</svg>
