<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Emperor Scum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="Emperor Scum: the card game where yesterday's Scum can be tomorrow's Emperor.">
  <meta name="theme-color" content="#08160f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Emperor Scum">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta property="og:title" content="Emperor Scum">
  <meta property="og:image" content="icon-512.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #08160f; overflow: hidden; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Home screen wrapper: gives the Apps Script game a proper icon and name when added to a phone's home screen. -->
  <iframe id="game" title="Emperor Scum" allow="clipboard-write; web-share"></iframe>
  <script>
    var APP = 'https://script.google.com/macros/s/AKfycbyd-Bh29WBTDi5KtLD0_uA5WgsK5NEROBVGs0EWlq575L4QbRX-dkbGUFPLNYSkLzq7/exec';
    document.getElementById('game').src = APP + location.search;
  </script>
</body>
</html>
